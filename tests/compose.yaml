services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbb
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dbb -d app"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: shoppw
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -prootpw -e 'select 1'"]
      interval: 3s
      retries: 40
      start_period: 20s

  mockping:
    image: python:3.14-alpine
    command: python /mock_ping.py
    volumes:
      - ./mock_ping.py:/mock_ping.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      retries: 20
