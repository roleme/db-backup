name: auto-release

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Release when dependency files changed since the latest tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          latest=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref' \
            | sed -n 's#^refs/tags/##p' | grep -E "$semver" | sort -V | tail -n1 || true)
          if [ -z "$latest" ]; then
            echo "No release tag yet, nothing to do." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed=$(gh api --paginate "repos/$REPO/compare/$latest...main" --jq '.files[].filename' \
            | grep -Fx -e Dockerfile -e go.mod -e go.sum || true)
          if [ -z "$changed" ]; then
            echo "No dependency changes since $latest." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow run release.yml --repo "$REPO" --ref main -f bump=patch
          {
            echo "Dispatched a patch release after $latest. Changed since then:"
            echo
            echo '```'
            echo "$changed"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
