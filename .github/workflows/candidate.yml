name: candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild without cache even if the candidate image exists
        type: boolean
        default: false

permissions: {}

concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/roleme/db-backup

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing candidate
        id: check
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          ref="$REGISTRY_IMAGE:sha-$GITHUB_SHA"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          if [ "$FORCE" = true ]; then
            echo "exists=false" >>"$GITHUB_OUTPUT"
          elif out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          elif grep -qi 'not found' <<<"$out"; then
            echo "exists=false" >>"$GITHUB_OUTPUT"
          else
            echo "::error::cannot tell whether $ref exists: $out"
            exit 1
          fi

      - name: Set up Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push candidate
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: ${{ inputs.force || false }}
          no-cache: ${{ inputs.force || false }}
          tags: ${{ steps.check.outputs.ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=db-backup
          cache-to: type=gha,scope=db-backup,mode=max

      - name: Resolve digest
        id: digest
        env:
          REF: ${{ steps.check.outputs.ref }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $REF"; exit 1; }
          echo "image=$REGISTRY_IMAGE@$digest" >>"$GITHUB_OUTPUT"
          echo "Candidate \`$REF\` is \`$digest\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Pull candidate
        env:
          IMAGE: ${{ steps.digest.outputs.image }}
        run: docker pull --quiet "$IMAGE"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Scan image
        env:
          IMAGE: ${{ steps.digest.outputs.image }}
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"

      - name: Run tests
        env:
          IMAGE: ${{ steps.digest.outputs.image }}
          SKIP_BUILD: "1"
        run: tests/run.sh
