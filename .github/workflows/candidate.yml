name: candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild without cache even if the candidate image exists
        type: boolean
        default: false

permissions: {}

concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/roleme/db-backup
  CANDIDATE: ghcr.io/roleme/db-backup:sha-${{ github.sha }}

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look up candidate
        id: lookup
        run: digest=$(docker buildx imagetools inspect "$CANDIDATE" --format '{{.Manifest.Digest}}' 2>/dev/null) && echo "digest=$digest" >>"$GITHUB_OUTPUT" || true

      - name: Set up Buildx
        if: inputs.force || steps.lookup.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push candidate
        id: build
        if: inputs.force || steps.lookup.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: ${{ inputs.force || false }}
          no-cache: ${{ inputs.force || false }}
          tags: ${{ env.CANDIDATE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=db-backup
          cache-to: type=gha,scope=db-backup,mode=max

      - name: Select candidate image
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.lookup.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $CANDIDATE"; exit 1; }
          echo "ref=$REGISTRY_IMAGE@$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Candidate \`$CANDIDATE\` is \`$DIGEST\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Pull candidate
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker pull --quiet "$IMAGE"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Scan image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"

      - name: Run tests
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          SKIP_BUILD: "1"
        run: tests/run.sh
