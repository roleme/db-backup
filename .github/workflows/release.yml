name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part to bump from the latest vX.Y.Z tag (ignored when version is set; first release is 1.0.0)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version X.Y.Z (optional, overrides bump)
        type: string
        required: false
        default: ""
      sha:
        description: Commit on main to release (optional, default is the head of main)
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/roleme/db-backup

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Plan version and commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
          VERSION_IN: ${{ inputs.version }}
          SHA_IN: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          latest=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref' \
            | sed -n 's#^refs/tags/v##p' | grep -E "$semver" | sort -V | tail -n1 || true)

          if [ -n "$VERSION_IN" ]; then
            [[ "$VERSION_IN" =~ $semver ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
            version=$VERSION_IN
          elif [ -z "$latest" ]; then
            version=1.0.0
          else
            IFS=. read -r ma mi pa <<<"$latest"
            case "$BUMP" in
              major) version="$((ma + 1)).0.0" ;;
              minor) version="$ma.$((mi + 1)).0" ;;
              patch) version="$ma.$mi.$((pa + 1))" ;;
              *) echo "::error::bad bump"; exit 1 ;;
            esac
          fi

          if [ -n "$latest" ]; then
            highest=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)
            if [ "$latest" = "$version" ] || [ "$highest" != "$version" ]; then
              echo "::error::$version is not greater than the latest release $latest"; exit 1
            fi
          fi
          if gh api "repos/$REPO/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version already exists"; exit 1
          fi

          if [ -z "$SHA_IN" ]; then
            sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          else
            [[ "$SHA_IN" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::sha must be a hex commit id"; exit 1; }
            sha=$(gh api "repos/$REPO/commits/$SHA_IN" --jq .sha)
          fi
          status=$(gh api "repos/$REPO/compare/main...$sha" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$sha is not on main ($status)"; exit 1 ;;
          esac

          conclusion=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=test" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.completed_at) | last | .conclusion // "missing"')
          [ "$conclusion" = success ] || { echo "::error::check 'test' on $sha is $conclusion"; exit 1; }

          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "Releasing v$version from $sha (previous: ${latest:-none})" >>"$GITHUB_STEP_SUMMARY"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          tags: db-backup:test

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Scan image
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 db-backup:test

      - name: Run tests
        env:
          SKIP_BUILD: "1"
        run: tests/run.sh

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }},enable=${{ !startsWith(needs.prepare.outputs.version, '0.') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null; then
            existing=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq .object.sha)
            [ "$existing" = "$SHA" ] || { echo "::error::$tag exists at $existing"; exit 1; }
          fi
          if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$REPO" --verify-tag --generate-notes --title "$tag" --latest
          fi
          {
            echo "Released $tag"
            echo
            echo "Image: \`$IMAGE:$VERSION\`"
          } >>"$GITHUB_STEP_SUMMARY"
